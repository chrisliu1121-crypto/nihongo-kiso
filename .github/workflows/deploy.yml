name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# GitHub Pages' own recommendation: don't cancel an in-flight deployment for
# a newer one, let them queue instead (a cancelled deploy can leave Pages
# serving a half-updated site).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/configure-pages@v5

      - run: npm ci

      - run: npm test

      # base must match the repo name because the site is served from
      # https://<user>.github.io/<repo>/, not the domain root.
      - run: VITE_BASE=/${{ github.event.repository.name }}/ npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
